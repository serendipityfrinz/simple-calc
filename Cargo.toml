[package]
name = "simple-calc"
version = "0.2.5"
edition = "2024"
authors = ["Frinz Sundiang <sundiangfrinz84@gmail.com>"]
description = "A (not so) simple CLI calculator made in Rust."
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/serendipityfrinz/simple-calc"
readme = "README.md"
keywords = ["calculator", "cli", "terminal", "math", "interactive"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clearscreen = "4.0.6"
colored = "3.1.1"
inquire = "0.9.4"
